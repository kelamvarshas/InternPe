<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right,  #FF00FF, #00FFFF); /* Gradient background */
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9); /* Semi-transparent white background */
            background-image: url("https://png.pngtree.com/thumb_back/fh260/background/20231211/pngtree-christmas-mosk-up-wish-list-on-purple-background-notebook-todo-list-image_15497116.jpg");
            padding: 2px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 710px;
            height: 400px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: pink;
        }

        form {
            display: flex;
            margin-bottom: 10px;
        }

        form input[type="text"] {
            flex: 1;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
            margin-left: 40px;
        }

        form button {
            padding: 8px 12px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 30px;
            margin-left: 30px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin-top: 10px;
        }

        li {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent white background */
            margin-bottom: 5px;
            border-radius: 5px;
            transition: transform 0.2s ease;
        }

        li.completed {
            text-decoration: line-through;
            opacity: 0.7;
        }

        li.high {
            border-left: 4px solid #f44336; /* Red border for high priority */
        }

        li.medium {
            border-left: 4px solid #FFA500; /* Orange border for medium priority */
        }

        li.low {
            border-left: 4px solid #2196F3; /* Blue border for low priority */
        }

        li button {
            padding: 5px 10px;
            background-color: #f44336;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #clear-btn {
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #f44336;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Add a task..." required>
            <button type="submit">Add Task</button>
        </form>
        <ul id="todo-list"></ul>
        <button id="clear-btn">Clear Completed</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('todo-form');
            const input = document.getElementById('todo-input');
            const todoList = document.getElementById('todo-list');
            const clearBtn = document.getElementById('clear-btn');

            let todos = [];

            // Load todos from localStorage on page load
            function loadTodos() {
                const todosString = localStorage.getItem('todos');
                todos = JSON.parse(todosString) || [];
                displayTodos();
            }

            // Save todos to localStorage
            function saveTodos() {
                localStorage.setItem('todos', JSON.stringify(todos));
            }

            // Add todo
            form.addEventListener('submit', function(event) {
                event.preventDefault();
                addTodo();
            });

            function addTodo() {
                const todoText = input.value.trim();
                if (todoText !== '') {
                    const priority = document.querySelector('input[name="priority"]:checked');
                    const todo = {
                        id: Date.now(),
                        text: todoText,
                        completed: false,
                        priority: priority ? priority.value : 'medium' // Default priority is medium
                    };
                    todos.push(todo);
                    input.value = '';
                    saveTodos();
                    displayTodos();
                }
            }

            // Display todos
            function displayTodos() {
                todoList.innerHTML = '';
                const sortedTodos = todos.sort((a, b) => (a.completed === b.completed) ? 0 : a.completed ? 1 : -1);
                sortedTodos.forEach(function(todo) {
                    const li = document.createElement('li');
                    li.id = todo.id;

                    // Add 'completed' class if task is completed
                    if (todo.completed) {
                        li.classList.add('completed');
                    }

                    // Add priority class based on todo.priority
                    if (todo.priority === 'high') {
                        li.classList.add('high');
                    } else if (todo.priority === 'medium') {
                        li.classList.add('medium');
                    } else if (todo.priority === 'low') {
                        li.classList.add('low');
                    }

                    li.innerHTML = `
                        <span>${todo.text}</span>
                        <button class="delete-btn">Delete</button>
                    `;

                    li.querySelector('span').addEventListener('click', function() {
                        toggleCompleted(todo.id);
                    });

                    li.querySelector('.delete-btn').addEventListener('click', function() {
                        deleteTodo(todo.id);
                    });

                    todoList.appendChild(li);
                });
            }

            // Toggle todo completion status
            function toggleCompleted(id) {
                todos = todos.map(function(todo) {
                    if (todo.id === id) {
                        return {
                            ...todo,
                            completed: !todo.completed
                        };
                    } else {
                        return todo;
                    }
                });

                saveTodos();
                displayTodos();
            }

            // Delete todo
            function deleteTodo(id) {
                todos = todos.filter(function(todo) {
                    return todo.id !== id;
                });

                saveTodos();
                displayTodos();
            }

            // Clear completed todos
            clearBtn.addEventListener('click', function() {
                todos = todos.filter(function(todo) {
                    return !todo.completed;
                });

                saveTodos();
                displayTodos();
            });

            // Initial load from localStorage
            loadTodos();
        });
    </script>
</body>
</html>

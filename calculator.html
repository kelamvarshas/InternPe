<!DOCTYPE html>
<html>
<head>
<title>Neon Dark Calculator</title>
<style>
body{
    background:#f3f0f0;          
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, sans-serif;
}
.calc{
    background:#dd0dcc;          
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 30px #0ff;    
}
#screen{
    width:100%;
    height:60px;
    margin-bottom:10px;
    font-size:24px;
    text-align:right;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#0f0f1a;          
    color:#00fff7;               
}
.buttons{
    display:grid;
    grid-template-columns:repeat(4,70px);
    gap:10px;
}
button{
    height:60px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#16213e;          
    color:#00fff7;               
    cursor:pointer;
    box-shadow:0 0 5px #0ff;
    transition:0.2s;
}
button:hover{
    background:#0f3460;          
    box-shadow:0 0 15px #0ff;
}
.equal{
    grid-column:span 2;
    background:#e94560;          
    color:white;
    box-shadow:0 0 10px #e94560;
}
.equal:hover{
    background:#ff2e50;
    box-shadow:0 0 20px #e94560;
}
</style>
</head>
<body>

<div class="calc">
    <input type="text" id="screen" disabled>

    <div class="buttons">
        <button onclick="clr()">C</button>
        <button onclick="del()">DEL</button>
        <button onclick="press('%')">%</button>
        <button onclick="press('/')">/</button>

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="press('*')">*</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('-')">-</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('+')">+</button>

        <button onclick="press('0')">0</button>
        <button onclick="press('.')">.</button>
        <button class="equal" onclick="calc()">=</button>
    </div>
</div>

<script>
let screen = document.getElementById("screen");

function press(val){
    screen.value += val;
}
function clr(){
    screen.value = "";
}
function del(){
    screen.value = screen.value.slice(0,-1);
}
function calc(){
    try{
        screen.value = eval(screen.value);
    } catch {
        screen.value = "Error";
    }
}
</script>

</body>
</html>
